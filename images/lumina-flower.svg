<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="luminaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="45%" stop-color="#8B7BF7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="petalGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="50%" stop-color="#9384F9"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="petalHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient soft glow -->
  <circle cx="100" cy="100" r="90" fill="url(#luminaGlow)"/>

  <!-- 6 Flower Petals -->
  <g transform="translate(100, 100)" filter="url(#softGlow)">
    <!-- Petal 1 (0 deg) -->
    <g transform="rotate(0)">
      <path d="M 0 -12 C -24 -36 -26 -76 0 -92 C 26 -76 24 -36 0 -12 Z" fill="url(#petalGrad1)"/>
      <path d="M 0 -14 C -12 -34 -14 -68 0 -84 C 6 -68 6 -34 0 -14 Z" fill="url(#petalHighlight)"/>
      <line x1="0" y1="-14" x2="0" y2="-72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- Petal 2 (60 deg) -->
    <g transform="rotate(60)">
      <path d="M 0 -12 C -24 -36 -26 -76 0 -92 C 26 -76 24 -36 0 -12 Z" fill="url(#petalGrad2)"/>
      <path d="M 0 -14 C -12 -34 -14 -68 0 -84 C 6 -68 6 -34 0 -14 Z" fill="url(#petalHighlight)"/>
      <line x1="0" y1="-14" x2="0" y2="-72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- Petal 3 (120 deg) -->
    <g transform="rotate(120)">
      <path d="M 0 -12 C -24 -36 -26 -76 0 -92 C 26 -76 24 -36 0 -12 Z" fill="url(#petalGrad1)"/>
      <path d="M 0 -14 C -12 -34 -14 -68 0 -84 C 6 -68 6 -34 0 -14 Z" fill="url(#petalHighlight)"/>
      <line x1="0" y1="-14" x2="0" y2="-72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- Petal 4 (180 deg) -->
    <g transform="rotate(180)">
      <path d="M 0 -12 C -24 -36 -26 -76 0 -92 C 26 -76 24 -36 0 -12 Z" fill="url(#petalGrad2)"/>
      <path d="M 0 -14 C -12 -34 -14 -68 0 -84 C 6 -68 6 -34 0 -14 Z" fill="url(#petalHighlight)"/>
      <line x1="0" y1="-14" x2="0" y2="-72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- Petal 5 (240 deg) -->
    <g transform="rotate(240)">
      <path d="M 0 -12 C -24 -36 -26 -76 0 -92 C 26 -76 24 -36 0 -12 Z" fill="url(#petalGrad1)"/>
      <path d="M 0 -14 C -12 -34 -14 -68 0 -84 C 6 -68 6 -34 0 -14 Z" fill="url(#petalHighlight)"/>
      <line x1="0" y1="-14" x2="0" y2="-72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>
    <!-- Petal 6 (300 deg) -->
    <g transform="rotate(300)">
      <path d="M 0 -12 C -24 -36 -26 -76 0 -92 C 26 -76 24 -36 0 -12 Z" fill="url(#petalGrad2)"/>
      <path d="M 0 -14 C -12 -34 -14 -68 0 -84 C 6 -68 6 -34 0 -14 Z" fill="url(#petalHighlight)"/>
      <line x1="0" y1="-14" x2="0" y2="-72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Flower Center Core -->
    <circle cx="0" cy="0" r="16" fill="#FDE047" opacity="0.95"/>
    <circle cx="0" cy="0" r="10" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Delicate golden stamens -->
    <circle cx="0" cy="-14" r="2.5" fill="#FEF08A"/>
    <circle cx="12" cy="-7" r="2.5" fill="#FEF08A"/>
    <circle cx="12" cy="7" r="2.5" fill="#FEF08A"/>
    <circle cx="0" cy="14" r="2.5" fill="#FEF08A"/>
    <circle cx="-12" cy="7" r="2.5" fill="#FEF08A"/>
    <circle cx="-12" cy="-7" r="2.5" fill="#FEF08A"/>
  </g>
</svg>
