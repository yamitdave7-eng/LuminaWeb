    <path d="M0 -18 C8 -18 16 -10 16 0 C16 10 8 18 0 18 C-8 18 -16 10 -16 0 C-16 -10 -8 -18 0 -18 Z" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" transform="rotate(90)"/>
    <path d="M0 -18 C8 -18 16 -10 16 0 C16 10 8 18 0 18 C-8 18 -16 10 -16 0 C-16 -10 -8 -18 0 -18 Z" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="5" fill="#7C5CFC"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
