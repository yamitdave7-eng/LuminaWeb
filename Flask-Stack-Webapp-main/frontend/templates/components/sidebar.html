<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <a class="sidebar-brand" href="{{ url_for('dashboard.index') }}" title="{{ app_name }}">
      <img src="{{ url_for('static', filename='images/lumina-logo-full.png') }}" alt="{{ app_name }}" class="brand-logo-full">
    </a>
    <button class="button quiet sidebar-close"
            type="button"
            aria-label="Close navigation">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="6"></line>
      </svg>
    </button>
  </div>

  <div class="sidebar-nav-container">
    <p class="nav-label">APPLICATION</p>
    <nav class="side-nav" aria-label="Application">
      <!-- Dashboard (Active) -->
      <a href="{{ url_for('dashboard.index') }}"
         class="nav-item {% if request.endpoint == 'dashboard.index' %}active{% endif %}"
         {% if request.endpoint == 'dashboard.index' %}aria-current="page"{% endif %}>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="2"></rect>
          <rect x="14" y="3" width="7" height="7" rx="2"></rect>
          <rect x="14" y="14" width="7" height="7" rx="2"></rect>
          <rect x="3" y="14" width="7" height="7" rx="2"></rect>
        </svg>
        <span>Dashboard</span>
      </a>

      <!-- Registered Framework Resources (Notes, Pages, etc.) -->
      {% for entry in navigation_resources %}
        <a href="{{ url_for(entry.key + '.index') }}"
           class="nav-item {% if request.blueprint == entry.key %}active{% endif %}"
           {% if request.blueprint == entry.key %}aria-current="page"{% endif %}>
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>{{ entry.label }}</span>
        </a>
      {% endfor %}

      <!-- File Library -->
      <a href="{{ url_for('files.index') }}"
         class="nav-item {% if request.blueprint == 'files' %}active{% endif %}"
         {% if request.blueprint == 'files' %}aria-current="page"{% endif %}>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>File library</span>
      </a>

      <!-- Activity -->
      <a href="{{ url_for('dashboard.activity') }}"
         class="nav-item {% if request.endpoint == 'dashboard.activity' %}active{% endif %}"
         {% if request.endpoint == 'dashboard.activity' %}aria-current="page"{% endif %}>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
        <span>Activity</span>
      </a>
    </nav>

    <!-- Student Full Tools Section -->
    <p class="nav-label">STUDENT TOOLS</p>
    <nav class="side-nav" aria-label="Student Tools">
      <button type="button" class="nav-item nav-tool-btn" data-open-modal="calendar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span>Full Calendar</span>
        <span class="tool-tag">⤢</span>
      </button>

      <button type="button" class="nav-item nav-tool-btn" data-open-modal="tracker">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 14 14"></polyline>
        </svg>
        <span>Habit Tracker</span>
        <span class="tool-tag">⤢</span>
      </button>

      <button type="button" class="nav-item nav-tool-btn" data-open-modal="quiz">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Active Quiz</span>
        <span class="tool-tag">🧠</span>
      </button>

      <button type="button" class="nav-item nav-tool-btn" data-open-modal="timer">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Zen Timer</span>
        <span class="tool-tag">⏳</span>
      </button>
    </nav>

    {% if current_user.is_admin %}
      <p class="nav-label">ADMINISTRATION</p>
      <nav class="side-nav" aria-label="Administration">
        <a href="{{ url_for('admin.index') }}" class="nav-item {% if request.endpoint == 'admin.index' %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Overview</span>
        </a>
        <a href="{{ url_for('admin.users') }}" class="nav-item {% if request.endpoint == 'admin.users' %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Accounts</span>
        </a>
        <a href="{{ url_for('admin.inquiries') }}" class="nav-item {% if request.endpoint == 'admin.inquiries' %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Messages</span>
        </a>
        <a href="{{ url_for('admin.audit') }}" class="nav-item {% if request.endpoint == 'admin.audit' %}active{% endif %}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>Audit log</span>
        </a>
      </nav>
    {% endif %}
  </div>

  <div class="sidebar-bottom">
    <a href="{{ url_for('public.home') }}" class="bottom-link">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      <span>View website ↗</span>
    </a>
    <a href="{{ url_for('account.profile') }}" class="bottom-link">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Account settings</span>
    </a>
    <form action="{{ url_for('auth.logout_page') }}" method="post" class="sidebar-signout-form">
      {{ logout_form.hidden_tag() }}
      <button class="bottom-link signout-btn" type="submit">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sign out</span>
      </button>
    </form>
  </div>
</aside>
